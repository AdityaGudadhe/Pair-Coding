services:
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: some-rabbit
    hostname: my-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "15672:15672"
      - "5672:5672"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: pc-store
    environment:
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniosecret
      # For older MinIO versions, the legacy env vars would be:
      # MINIO_ACCESS_KEY: miniouser
      # MINIO_SECRET_KEY: miniosecret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    # volumes:
    #   - /var/lib/pair-coding/store/:/data
    # No volumes for now; storage is ephemeral in the container.

  postgres:
    image: postgres:14.23-trixie
    container_name: paircoding-postgres
    environment:
      POSTGRES_USER: paircoding
      POSTGRES_PASSWORD: paircodingpass
      POSTGRES_DB: paircoding
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
